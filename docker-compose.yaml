services:
  db:
    image: mysql:latest
    container_name: mysql-almacen-db
    environment:
      MYSQL_ROOT_PASSWORD: api_almacen
      MYSQL_DATABASE: almacen_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  api:
    build: .
    container_name: fastapi-almacen
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

volumes:
  # Hacemos que los datos de MySQL persistan aunque se llegue a borrar el contenedor
  mysql_data:
